# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.0"
metadata:
  name: language-translator
type: application
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://dnddev.grcnub.com/
          client: '800'
        app:
          name: ZGCP_TRANS_APP
          description: PLM Language Translator App
          package: ZGCP_TRANS_APP
          transport: S18K901457
        exclude:
          - /test/
